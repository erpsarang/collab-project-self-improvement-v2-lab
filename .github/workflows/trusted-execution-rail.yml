name: Trusted Execution Rail
run-name: Trusted Rail approval for issue #${{ github.event.issue.number }}

on:
  issues:
    types: [labeled]

permissions: {}

# Only approval events share the per-Issue serialization boundary. GitHub may replace
# a pending run even when cancellation is disabled, so unrelated labels get a unique group.
concurrency:
  group: ${{ github.event.label.name == 'SI-승인' && format('trusted-rail-issue-{0}', github.event.issue.number) || format('trusted-rail-nonapproval-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  authorize_start:
    name: Authorize label approval and freeze inputs
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pull-requests: read
    outputs:
      authorized: ${{ steps.authorize.outputs.authorized }}
      stop_reason: ${{ steps.authorize.outputs.stop_reason }}
      issue_number: ${{ steps.authorize.outputs.issue_number }}
      root_base_sha: ${{ steps.authorize.outputs.root_base_sha }}
      target_branch: ${{ steps.authorize.outputs.target_branch }}
    steps:
      - id: authorize
        name: Fail closed because event-time permission provenance is unavailable
        env:
          GH_READ_TOKEN: ${{ github.token }}
          APPROVAL_LABEL: ${{ github.event.label.name }}
          APPROVING_ACTOR: ${{ github.actor }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          EVENT_ROOT_BASE_SHA: ${{ github.sha }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const repo = process.env.GITHUB_REPOSITORY;
          const issue = Number(process.env.ISSUE_NUMBER);
          const actor = process.env.APPROVING_ACTOR;
          const label = process.env.APPROVAL_LABEL;
          const target = `self-improvement/${issue}`;
          const headers = {
            Accept: 'application/vnd.github+json',
            Authorization: `Bearer ${process.env.GH_READ_TOKEN}`,
            'X-GitHub-Api-Version': '2022-11-28',
          };
          const output = process.env.GITHUB_OUTPUT;
          const summary = process.env.GITHUB_STEP_SUMMARY;

          async function request(path, allowed = [200]) {
            const response = await fetch(`https://api.github.com/repos/${repo}${path}`, { headers });
            if (!allowed.includes(response.status)) {
              throw new Error(`${path} failed: ${response.status} ${await response.text()}`);
            }
            return { status: response.status, data: response.status === 204 || response.status === 404 ? null : await response.json() };
          }
          function finish(authorized, reason, base = '') {
            const values = {
              authorized: String(authorized), stop_reason: reason, issue_number: String(issue),
              root_base_sha: base, target_branch: target,
            };
            fs.appendFileSync(output, Object.entries(values).map(([key, value]) => `${key}=${value}\n`).join(''));
            fs.appendFileSync(summary, [
              '## Trusted start approval provenance', '',
              `- Approved issue: #${issue}`,
              `- Approval label: \`${label}\``,
              `- Approving actor: \`${actor}\``,
              `- Approval event/run: \`${process.env.GITHUB_EVENT_NAME}/${process.env.GITHUB_RUN_ID}/${process.env.GITHUB_RUN_ATTEMPT}\``,
              `- Frozen root base SHA: \`${base || '(not frozen)'}\``,
              `- Target branch: \`${target}\``,
              `- Start decision: **${authorized ? 'AUTHORIZED' : reason}**`, '',
            ].join('\n'));
          }
          async function main() {
            if (label !== 'SI-승인') return finish(false, 'STOPPED(INVALID_APPROVAL_LABEL)');

            // The issues:labeled payload records who applied the label, but not that
            // actor's repository permission at label time. github.actor and the
            // collaborator permission API are evaluated when an attempt executes;
            // queued runs and reruns can therefore observe later permission changes.
            // Do not turn that mutable observation into approval provenance.
            return finish(false, 'STOPPED(DESIGN_LIMITATION)');

            const encodedRef = encodeURIComponent(`heads/${target}`);
            const branch = await request(`/git/ref/${encodedRef}`, [200, 404]);
            if (branch.status === 200) return finish(false, 'STOPPED(TARGET_BRANCH_EXISTS)');

            const [owner] = repo.split('/');
            const pulls = await request(`/pulls?state=open&head=${encodeURIComponent(`${owner}:${target}`)}&per_page=1`);
            if (pulls.data.length > 0) return finish(false, 'STOPPED(OPEN_PR_EXISTS)');

            // github.sha is the default-branch HEAD recorded on the label webhook event.
            // Immediately before starting IMPLEMENT, fail closed if main has moved since approval.
            const base = process.env.EVENT_ROOT_BASE_SHA;
            if (!/^[0-9a-f]{40}$/.test(base)) throw new Error('Approval event supplied an invalid root base SHA');
            const mainRef = await request('/git/ref/heads/main');
            if (mainRef.data.object.sha !== base) {
              return finish(false, 'STOPPED(MAIN_MOVED_SINCE_APPROVAL)', base);
            }
            finish(true, '', base);
          }
          main().catch((error) => { console.error(error); process.exit(1); });
          NODE

  iteration_0:
    name: IMPLEMENT → PUBLISH → VERIFY → REVIEW
    needs: authorize_start
    if: ${{ needs.authorize_start.outputs.authorized == 'true' }}
    permissions:
      contents: write
      pull-requests: write
      issues: read
    uses: ./.github/workflows/trusted-rail-iteration.yml
    with:
      attempt: "0"
      issue_number: ${{ needs.authorize_start.outputs.issue_number }}
      root_base_sha: ${{ needs.authorize_start.outputs.root_base_sha }}
      parent_sha: ${{ needs.authorize_start.outputs.root_base_sha }}
      target_branch: ${{ needs.authorize_start.outputs.target_branch }}
      expected_head: ""
    secrets:
      CODEX_API_KEY: ${{ secrets.CODEX_API_KEY }}

  iteration_1:
    name: FIX #1 → PUBLISH → VERIFY → REVIEW
    needs: [authorize_start, iteration_0]
    if: ${{ always() && needs.authorize_start.outputs.authorized == 'true' && needs.iteration_0.outputs.status == 'FINDING' }}
    permissions:
      contents: write
      pull-requests: write
      issues: read
    uses: ./.github/workflows/trusted-rail-iteration.yml
    with:
      attempt: "1"
      issue_number: ${{ needs.authorize_start.outputs.issue_number }}
      root_base_sha: ${{ needs.authorize_start.outputs.root_base_sha }}
      parent_sha: ${{ needs.iteration_0.outputs.published_head }}
      target_branch: ${{ needs.authorize_start.outputs.target_branch }}
      expected_head: ${{ needs.iteration_0.outputs.published_head }}
      previous_review_artifact: semantic-review-0
    secrets:
      CODEX_API_KEY: ${{ secrets.CODEX_API_KEY }}

  iteration_2:
    name: FIX #2 → PUBLISH → VERIFY → REVIEW
    needs: [authorize_start, iteration_1]
    if: ${{ always() && needs.authorize_start.outputs.authorized == 'true' && needs.iteration_1.outputs.status == 'FINDING' }}
    permissions:
      contents: write
      pull-requests: write
      issues: read
    uses: ./.github/workflows/trusted-rail-iteration.yml
    with:
      attempt: "2"
      issue_number: ${{ needs.authorize_start.outputs.issue_number }}
      root_base_sha: ${{ needs.authorize_start.outputs.root_base_sha }}
      parent_sha: ${{ needs.iteration_1.outputs.published_head }}
      target_branch: ${{ needs.authorize_start.outputs.target_branch }}
      expected_head: ${{ needs.iteration_1.outputs.published_head }}
      previous_review_artifact: semantic-review-1
    secrets:
      CODEX_API_KEY: ${{ secrets.CODEX_API_KEY }}

  terminal_state:
    name: Terminal state
    if: ${{ always() }}
    needs: [authorize_start, iteration_0, iteration_1, iteration_2]
    runs-on: ubuntu-latest
    permissions: {}
    env:
      AUTHORIZED: ${{ needs.authorize_start.outputs.authorized }}
      AUTH_STOP: ${{ needs.authorize_start.outputs.stop_reason }}
      S0: ${{ needs.iteration_0.outputs.status }}
      S1: ${{ needs.iteration_1.outputs.status }}
      S2: ${{ needs.iteration_2.outputs.status }}
    steps:
      - name: Resolve bounded terminal state
        run: |
          if [ "$AUTHORIZED" != "true" ]; then
            state="${AUTH_STOP:-STOPPED(START_AUTHORIZATION_FAILED)}"
          elif [ "$S0" = "PASS" ]; then
            state="MERGE_READY"
          elif [[ "$S0" == STOPPED* ]] || [ -z "$S0" ]; then
            state="${S0:-STOPPED(RAIL_ITERATION_FAILED)}"
          elif [ "$S1" = "PASS" ]; then
            state="MERGE_READY"
          elif [[ "$S1" == STOPPED* ]] || [ -z "$S1" ]; then
            state="${S1:-STOPPED(RAIL_ITERATION_FAILED)}"
          elif [ "$S2" = "PASS" ]; then
            state="MERGE_READY"
          elif [[ "$S2" == STOPPED* ]] || [ -z "$S2" ]; then
            state="${S2:-STOPPED(RAIL_ITERATION_FAILED)}"
          else
            state="STOPPED(FIX_BUDGET_EXHAUSTED)"
          fi

          echo "## Trusted Execution Rail" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Final state: $state**" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Auto Merge is disabled. Human decides the final merge." >> "$GITHUB_STEP_SUMMARY"
          echo "$state"
