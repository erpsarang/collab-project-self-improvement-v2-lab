name: Trusted Rail Iteration

on:
  workflow_call:
    inputs:
      attempt:
        required: true
        type: string
      issue_number:
        required: true
        type: string
      root_base_sha:
        required: true
        type: string
      parent_sha:
        required: true
        type: string
      target_branch:
        required: true
        type: string
      expected_head:
        required: false
        default: ""
        type: string
      previous_review_artifact:
        required: false
        default: ""
        type: string
    secrets:
      CODEX_API_KEY:
        required: true
    outputs:
      status:
        value: ${{ jobs.iteration_terminal.outputs.status }}
      published_head:
        value: ${{ jobs.publish.outputs.published_head }}
      pr_number:
        value: ${{ jobs.publish.outputs.pr_number }}

permissions: {}

env:
  RAIL_REPOSITORY: ${{ github.repository }}
  RAIL_BASE_BRANCH: main
  RAIL_ROOT_BASE_SHA: ${{ inputs.root_base_sha }}
  RAIL_TARGET_BRANCH: ${{ inputs.target_branch }}
  RAIL_ISSUE_NUMBER: ${{ inputs.issue_number }}
  RAIL_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.attempt }}

jobs:
  implement_or_fix:
    name: ${{ inputs.attempt == '0' && 'IMPLEMENT' || 'FIX' }} (no GitHub write credential)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.parent_sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - name: Build trusted artifact tooling before Codex
        run: npm run build --silent

      - name: Validate exact parent checkout
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "${{ inputs.parent_sha }}"
          case "${{ inputs.target_branch }}" in
            self-improvement/*) ;;
            *) echo "target_branch must start with self-improvement/" >&2; exit 1 ;;
          esac

      - name: Fetch implementation Issue
        if: ${{ inputs.attempt == '0' }}
        env:
          GH_READ_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const repo = process.env.GITHUB_REPOSITORY;
          const issue = process.env.ISSUE_NUMBER;
          fetch(`https://api.github.com/repos/${repo}/issues/${issue}`, {
            headers: {
              Accept: 'application/vnd.github+json',
              Authorization: `Bearer ${process.env.GH_READ_TOKEN}`,
              'X-GitHub-Api-Version': '2022-11-28',
            },
          }).then(async (response) => {
            if (!response.ok) throw new Error(`Issue fetch failed: ${response.status} ${await response.text()}`);
            const data = await response.json();
            fs.mkdirSync('.trusted-rail', { recursive: true });
            fs.writeFileSync('.trusted-rail/prompt.md', [
              `Issue #${issue}를 구현하세요.`, '',
              '규칙:',
              '- workspace source만 수정하고 GitHub publish/PR/merge는 수행하지 마세요.',
              '- .github/, package.json, package-lock.json, scripts/, src/trusted-rail/, docs/trusted-execution-rail.md는 수정하지 마세요.',
              '- 기존 아키텍처를 존중하고 최소 변경으로 구현하세요.',
              '- 구현에 필요한 테스트를 추가하세요.', '',
              `제목: ${data.title}`, '', data.body || '(본문 없음)',
            ].join('\n'));
          }).catch((error) => { console.error(error); process.exit(1); });
          NODE

      - uses: actions/download-artifact@v4
        if: ${{ inputs.attempt != '0' }}
        with:
          name: ${{ inputs.previous_review_artifact }}
          path: .trusted-rail/review

      - name: Build bounded fix prompt
        if: ${{ inputs.attempt != '0' }}
        shell: bash
        run: |
          mkdir -p .trusted-rail
          cat > .trusted-rail/prompt.md <<'EOF_PROMPT'
          아래 semantic review finding만 수정하세요.
          새 기능을 확장하지 말고 finding을 해결하는 최소 변경만 하세요.
          GitHub publish/PR/merge를 수행하지 마세요.
          .github/, package.json, package-lock.json, scripts/, src/trusted-rail/, docs/trusted-execution-rail.md는 수정하지 마세요.

          Review result:
          EOF_PROMPT
          cat .trusted-rail/review/semantic-review.json >> .trusted-rail/prompt.md

      - name: Codex workspace change
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.CODEX_API_KEY }}
          prompt-file: .trusted-rail/prompt.md
          sandbox: workspace-write
          safety-strategy: drop-sudo

      - name: Freeze immutable artifact before executing changed code
        env:
          RAIL_PARENT_SHA: ${{ inputs.parent_sha }}
          RAIL_EXPECTED_HEAD: ${{ inputs.expected_head }}
          RAIL_OUTPUT_PATH: .trusted-rail/artifact/artifact.json
        run: node dist/trusted-rail/build-artifact.js

      - name: Verify task-local change
        run: |
          npm test
          npm run typecheck

      - uses: actions/upload-artifact@v4
        with:
          name: implementation-${{ inputs.attempt }}
          path: .trusted-rail/artifact/
          if-no-files-found: error
          retention-days: 1

  publish:
    name: PUBLISH (trusted write boundary)
    needs: implement_or_fix
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      published_head: ${{ steps.publish.outputs.published_head }}
      pr_number: ${{ steps.publish.outputs.pr_number }}
      stop_reason: ${{ steps.publish.outputs.stop_reason }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.root_base_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build --silent
      - uses: actions/download-artifact@v4
        with:
          name: implementation-${{ inputs.attempt }}
          path: .trusted-rail/artifact
      - id: publish
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RAIL_ARTIFACT_PATH: .trusted-rail/artifact/artifact.json
          RAIL_PUBLISH_RESULT_PATH: .trusted-rail/publish/publish-result.json
        run: node dist/trusted-rail/publish-cli.js
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publish-result-${{ inputs.attempt }}
          path: .trusted-rail/publish/
          if-no-files-found: warn
          retention-days: 1

  verify_published:
    name: VERIFY exact published HEAD
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.publish.outputs.published_head }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: implementation-${{ inputs.attempt }}
          path: .trusted-rail/artifact
      - run: npm run build --silent
      - name: Verify manifest, file digests and branch HEAD
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RAIL_ARTIFACT_PATH: .trusted-rail/artifact/artifact.json
          RAIL_PUBLISHED_HEAD: ${{ needs.publish.outputs.published_head }}
        run: node dist/trusted-rail/verify-cli.js
      - run: |
          npm test
          npm run typecheck

  semantic_review:
    name: SEMANTIC REVIEW of verified SHA
    needs: [publish, verify_published]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      status: ${{ steps.parse.outputs.status }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.publish.outputs.published_head }}
          fetch-depth: 0
          persist-credentials: false
      - name: Codex read-only semantic review
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.CODEX_API_KEY }}
          sandbox: read-only
          safety-strategy: drop-sudo
          output-file: semantic-review.json
          output-schema: |
            {
              "type": "object",
              "properties": {
                "status": {"type": "string", "enum": ["PASS", "FINDING"]},
                "summary": {"type": "string"},
                "findings": {
                  "type": "array",
                  "items": {
                    "type": "object",
                    "properties": {
                      "severity": {"type": "string", "enum": ["P1", "P2"]},
                      "title": {"type": "string"},
                      "body": {"type": "string"}
                    },
                    "required": ["severity", "title", "body"],
                    "additionalProperties": false
                  }
                }
              },
              "required": ["status", "summary", "findings"],
              "additionalProperties": false
            }
          prompt: |
            Exact verified published HEAD `${{ needs.publish.outputs.published_head }}`를 리뷰하세요.
            parent `${{ inputs.parent_sha }}` 이후 변경의 correctness, security, trust-boundary 위반만 검토하세요.
            미용/취향/사소한 제안은 finding으로 만들지 마세요. 실제 수정이 필요한 P1/P2만 FINDING으로 반환하세요.
            코드나 GitHub 상태를 수정하지 마세요.
      - id: parse
        run: node -e "const r=require('./semantic-review.json'); if(r.status==='FINDING'&&!r.findings.length) process.exit(2); require('fs').appendFileSync(process.env.GITHUB_OUTPUT,'status='+r.status+'\\n')"
      - uses: actions/upload-artifact@v4
        with:
          name: semantic-review-${{ inputs.attempt }}
          path: semantic-review.json
          retention-days: 1

  iteration_terminal:
    name: Iteration result
    if: ${{ always() }}
    needs: [implement_or_fix, publish, verify_published, semantic_review]
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      status: ${{ steps.result.outputs.status }}
    env:
      IMPLEMENT_RESULT: ${{ needs.implement_or_fix.result }}
      PUBLISH_RESULT: ${{ needs.publish.result }}
      PUBLISH_STOP: ${{ needs.publish.outputs.stop_reason }}
      VERIFY_RESULT: ${{ needs.verify_published.result }}
      REVIEW_RESULT: ${{ needs.semantic_review.result }}
      REVIEW_STATUS: ${{ needs.semantic_review.outputs.status }}
    steps:
      - id: result
        shell: bash
        run: |
          if [ "$IMPLEMENT_RESULT" != "success" ]; then
            status="STOPPED(IMPLEMENT_OR_FIX_FAILED)"
          elif [ "$PUBLISH_RESULT" != "success" ]; then
            status="STOPPED(${PUBLISH_STOP:-PUBLISH_FAILED})"
          elif [ "$VERIFY_RESULT" != "success" ]; then
            status="STOPPED(PUBLISHED_ARTIFACT_VERIFY_FAILED)"
          elif [ "$REVIEW_RESULT" != "success" ]; then
            status="STOPPED(SEMANTIC_REVIEW_FAILED)"
          else
            status="$REVIEW_STATUS"
          fi
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "$status"
